# /etc/nginx/sites-available/schwindelex.blanke.nrw
#
# Aufbau wie republic-of-rome.blanke.nrw: eigenes Zertifikat, HTTP leitet auf
# HTTPS um. Dahinter läuft der Node-Server aus dem Docker-Stapel (127.0.0.1:3020),
# der Client und WebSocket selbst ausliefert.

server {
    server_name schwindelex.blanke.nrw;

    # Ein WebSocket pro Spieler. Der Server pingt alle 25 s, Partien dauern Stunden.
    location = /ws {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        # Der Server zählt Rate-Limits nach X-Real-IP (nicht X-Forwarded-For, das ist fälschbar).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        include snippets/schwindelex-headers.conf;
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Der Node-Server komprimiert nicht.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    client_max_body_size 16k;

    location ~ /\. {
        deny all;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/schwindelex.blanke.nrw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schwindelex.blanke.nrw/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name schwindelex.blanke.nrw;

    # Muss über HTTP erreichbar bleiben, sonst scheitert die automatische
    # Zertifikatserneuerung. Steht vor der Umleitung, ^~ schlägt sie.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
