# /etc/nginx/snippets/schwindelex-headers.conf
#
# Muss in JEDEN location-Block der Seite eingebunden werden: Sobald ein
# location-Block ein eigenes add_header setzt, verwirft nginx sämtliche
# geerbten Header aus dem server-Block.
#
# CSP, nosniff, Referrer-Policy und X-Frame-Options setzt der Node-Server selbst
# (server/src/net/server.ts) – hier nur, was ausschließlich unter HTTPS Sinn ergibt
# oder vom Server nicht kommt. Keine Doppelungen, sonst gelten zwei CSPs.

# Ein Jahr, ohne preload: Bei einem Zertifikatsproblem bleibt die Seite
# reparierbar, statt in Browsern dauerhaft blockiert zu sein.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
